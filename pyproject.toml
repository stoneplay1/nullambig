[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneplay1-nullambig"
version = "0.1.0"
description = "从输入中抽取数值，计算空值与缺失的歧义相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "stoneplay1" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://stoneplay1.github.io"
Repository = "https://github.com/stoneplay1/nullambig"
Issues = "https://github.com/stoneplay1/nullambig/issues"

[project.scripts]
nullambig = "nullambig:main"

[tool.setuptools]
py-modules = ["nullambig"]
